spring.application.name=event_generator
spring.main.banner-mode=off
# hasło producenta i HMAC_KEY z tego samego .env co docker-compose (katalog generatora albo nadrzędny)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# generator działa na hoście, więc łączy się przez listener EXTERNAL
spring.kafka.bootstrap-servers=localhost:29092
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.properties.security.protocol=SASL_PLAINTEXT
spring.kafka.properties.sasl.mechanism=SCRAM-SHA-512
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="producer" password="${KAFKA_PRODUCER_PASSWORD}";

generator.accounts=10

# logi klienta Kafki zagłuszałyby konsolę z komendami
logging.level.org.apache.kafka=WARN
