# Jeden węzeł KRaft: broker + kontroler w jednym procesie.
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@localhost:9093

# SASL       - klienci w sieci dockerowej (kafka:9092) i komunikacja broker-broker
# EXTERNAL   - klienci z hosta, np. generator uruchomiony z IntelliJ (localhost:29092)
# CONTROLLER - bez uwierzytelniania, ale nasłuchuje tylko na loopbacku wewnątrz kontenera
listeners=SASL://:9092,EXTERNAL://:29092,CONTROLLER://localhost:9093
advertised.listeners=SASL://kafka:9092,EXTERNAL://localhost:29092
listener.security.protocol.map=SASL:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT
controller.listener.names=CONTROLLER
inter.broker.listener.name=SASL

# Uwierzytelnianie: SCRAM-SHA-512. Hasło admina czytane ze zmiennej środowiskowej, nie z pliku.
config.providers=env
config.providers.env.class=org.apache.kafka.common.config.provider.EnvVarConfigProvider
sasl.enabled.mechanisms=SCRAM-SHA-512
sasl.mechanism.inter.broker.protocol=SCRAM-SHA-512
listener.name.sasl.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="admin" password="${env:KAFKA_ADMIN_PASSWORD}";
listener.name.external.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required;

# Autoryzacja: wszystko zabronione, chyba że ACL pozwala.
# ANONYMOUS = tylko listener CONTROLLER, osiągalny wyłącznie z wnętrza kontenera.
authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
allow.everyone.if.no.acl.found=false
super.users=User:admin;User:ANONYMOUS

log.dirs=/var/lib/kafka/data
auto.create.topics.enable=false
num.partitions=3
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
