name: dymora

# Konfiguracja wspólna dla jobmanagera i taskmanagera Flinka.
x-flink-properties: &flink-properties |
  jobmanager.rpc.address: jobmanager
  taskmanager.numberOfTaskSlots: 2
  execution.checkpointing.dir: s3://flink-checkpoints/checkpoints
  s3.endpoint: http://silo:9000
  s3.path.style.access: true
  s3.access-key: ${SILO_ROOT_USER}
  s3.secret-key: ${SILO_ROOT_PASSWORD}

services:
  kafka:
    image: apache/kafka:4.4.0
    hostname: kafka
    environment:
      KAFKA_ADMIN_PASSWORD: ${KAFKA_ADMIN_PASSWORD:?brak w .env}
    # Pierwszy użytkownik (admin) musi istnieć już przy formatowaniu storage, bo SCRAM trzyma hasła w metadanych KRaft.
    command:
      - bash
      - -c
      - >-
        /opt/kafka/bin/kafka-storage.sh format --ignore-formatted -t MkU3OEVBNTcwNTJENDM2Qk
        -c /opt/kafka/config/secure/server.properties
        --add-scram "SCRAM-SHA-512=[name=admin,password=$$KAFKA_ADMIN_PASSWORD]"
        && exec /opt/kafka/bin/kafka-server-start.sh /opt/kafka/config/secure/server.properties
    volumes:
      - ./kafka/server.properties:/opt/kafka/config/secure/server.properties:ro
      - kafka-data:/var/lib/kafka/data
    ports:
      - "127.0.0.1:29092:29092" # tylko localhost, nie cała sieć Wi-Fi
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9092'"]
      interval: 5s
      retries: 30

  kafka-init:
    image: apache/kafka:4.4.0
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_ADMIN_PASSWORD: ${KAFKA_ADMIN_PASSWORD}
      KAFKA_PRODUCER_PASSWORD: ${KAFKA_PRODUCER_PASSWORD:?brak w .env}
      KAFKA_FLINK_PASSWORD: ${KAFKA_FLINK_PASSWORD:?brak w .env}
      KAFKA_UI_PASSWORD: ${KAFKA_UI_PASSWORD:?brak w .env}
    entrypoint: ["bash", "/init.sh"]
    volumes:
      - ./kafka/init.sh:/init.sh:ro
    restart: "no"

  # Silo: utrzymywany fork MinIO (obrazy minio/minio nie są już publikowane), to samo S3 API.
  silo:
    image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    command: silo server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${SILO_ROOT_USER:?brak w .env}
      MINIO_ROOT_PASSWORD: ${SILO_ROOT_PASSWORD:?brak w .env}
    volumes:
      - silo-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001" # konsola WWW
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 5s
      retries: 30

  silo-init:
    image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    depends_on:
      silo:
        condition: service_healthy
    environment:
      SILO_ROOT_USER: ${SILO_ROOT_USER}
      SILO_ROOT_PASSWORD: ${SILO_ROOT_PASSWORD}
    entrypoint:
      - sh
      - -c
      - >-
        mc alias set local http://silo:9000 "$$SILO_ROOT_USER" "$$SILO_ROOT_PASSWORD"
        && mc mb --ignore-existing local/flink-checkpoints
    restart: "no"

  jobmanager:
    image: flink:2.2.1-java21
    hostname: jobmanager
    # application mode: jobmanager sam uruchamia job z jara w /opt/flink/usrlib
    command: standalone-job --job-classname io.bhd.flinkjob.IntegrityJob
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      silo-init:
        condition: service_completed_successfully
    environment:
      ENABLE_BUILT_IN_PLUGINS: flink-s3-fs-presto-2.2.1.jar
      FLINK_PROPERTIES: *flink-properties
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_USER: flink
      KAFKA_PASSWORD: ${KAFKA_FLINK_PASSWORD}
      HMAC_KEY: ${HMAC_KEY:?brak w .env}
    volumes:
      - ./flink-job/target/flink-job-0.0.1-SNAPSHOT.jar:/opt/flink/usrlib/flink-job.jar:ro
    ports:
      - "127.0.0.1:8081:8081" # panel Flinka
    restart: unless-stopped

  taskmanager:
    image: flink:2.2.1-java21
    command: taskmanager
    depends_on:
      - jobmanager
    environment:
      ENABLE_BUILT_IN_PLUGINS: flink-s3-fs-presto-2.2.1.jar
      FLINK_PROPERTIES: *flink-properties
    volumes:
      # taskmanager wykonuje kod joba, więc też potrzebuje jara
      - ./flink-job/target/flink-job-0.0.1-SNAPSHOT.jar:/opt/flink/usrlib/flink-job.jar:ro
    restart: unless-stopped

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_READONLY: "true"
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_MECHANISM: SCRAM-SHA-512
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_JAAS_CONFIG: org.apache.kafka.common.security.scram.ScramLoginModule required username="ui" password="${KAFKA_UI_PASSWORD}";
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  kafka-data:
  silo-data:
